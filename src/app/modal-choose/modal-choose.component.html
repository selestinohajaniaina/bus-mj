<ion-modal [trigger]="trigger" [initialBreakpoint]="0.75" [breakpoints]="[0, 0.75, 1]" #modalChoose>
  <ng-template>
    <ion-content class="ion-padding">

      <ion-img src="assets/map.gif" />

      <ion-title>RECHERCHER UN LIEU ENREGISTRÉ</ion-title>

      <ion-text color="medium">
        Recherchez un lieu enregistré pour afficher votre itinéraire.
      </ion-text>

      <div class="input-search">
        <ion-input type="search" placeholder="Adresse ou lieu à Mahajanga" [(ngModel)]="querySearch"><ion-icon
            name="search-outline" slot="start"></ion-icon></ion-input>
      </div>


      <ion-fab slot="fixed" vertical="top" horizontal="start">
        <ion-fab-button color="light" (click)="modalChoose.dismiss()" size="small">
          <ion-icon name="chevron-down"></ion-icon>
        </ion-fab-button>
      </ion-fab>

    </ion-content>
  </ng-template>
</ion-modal>
