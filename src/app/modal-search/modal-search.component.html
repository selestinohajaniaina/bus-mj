<ion-modal trigger="open-modal-search" [initialBreakpoint]="0.75" [breakpoints]="[0, 0.75, 1]" #modalSearch>
  <ng-template>
    <ion-content class="ion-padding">

      <ion-img src="assets/map.gif" />

      <ion-title>RECHERCHER UN ENDROIT</ion-title>

      <ion-text color="medium">
        Recherchez un lieu, puis enregistrez les arrêts de bus les plus proches pour retrouver facilement votre bus.
      </ion-text>

      <ion-text color="warning">
        <ion-icon name="warning"></ion-icon>
        Une connexion Internet est requise pour rechercher des lieux.
      </ion-text>

      <div class="input-search">
        <ion-input type="search" placeholder="Adresse ou lieu à Mahajanga" [(ngModel)]="querySearch"><ion-icon
            name="search-outline" slot="start"></ion-icon></ion-input>
      </div>
      <ion-button expand="block" shape="round" (click)="find()">
        <ion-text>Lancer la rechercher</ion-text>
        <ion-icon aria-hidden="true" name="search" slot="end"></ion-icon>
      </ion-button>

      <div class="contener">
        <ion-title size="small" color="medium">Resultats de votre recherche (00):</ion-title>

        <ion-card>
          <ion-card-content class="desc">
            <ion-card-title>display_name</ion-card-title>
            <ion-text>sous-titre</ion-text>
            <p> <ion-badge>distance</ion-badge> ou arrets proche</p>
          </ion-card-content>
        </ion-card>
      </div>

    </ion-content>
  </ng-template>
</ion-modal>
